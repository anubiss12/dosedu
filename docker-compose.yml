version: "3.9"

# dosedu.kz — full stack orchestration
# Subdomains: dosedu.kz, s-admin., director., teacher. all resolve to the
# same Nginx entrypoint, which reverse-proxies to the single Go API
# container (host-based routing is enforced again inside the API by JWT
# role checks, so Nginx routing is a convenience layer, not a security
# boundary by itself).

services:
  api:
    build: .
    container_name: dosedu_api
    restart: unless-stopped
    environment:
      APP_ENV: production
      HTTP_PORT: "8080"
      POSTGRES_DSN: "postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      REDIS_PASSWORD: "${REDIS_PASSWORD}"
      JWT_SECRET: "${JWT_SECRET}"
      TELEGRAM_BOT_TOKEN: "${TELEGRAM_BOT_TOKEN}"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [dosedu_net]
    expose: ["8080"]

  postgres:
    image: postgres:16-alpine
    container_name: dosedu_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${POSTGRES_USER}"
      POSTGRES_PASSWORD: "${POSTGRES_PASSWORD}"
      POSTGRES_DB: "${POSTGRES_DB}"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./internal/db/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dosedu_net]
    expose: ["5432"]

  redis:
    image: redis:7-alpine
    container_name: dosedu_redis
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks: [dosedu_net]
    expose: ["6379"]

  nginx:
    image: nginx:1.27-alpine
    container_name: dosedu_nginx
    restart: unless-stopped
    depends_on: [api]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./deploy/certbot/conf:/etc/letsencrypt:ro
      - ./deploy/certbot/www:/var/www/certbot:ro
    networks: [dosedu_net]

  certbot:
    image: certbot/certbot:latest
    container_name: dosedu_certbot
    volumes:
      - ./deploy/certbot/conf:/etc/letsencrypt
      - ./deploy/certbot/www:/var/www/certbot
    # Initial issuance is run manually (see deploy/README.md); this
    # entrypoint just renews on a loop once certs already exist.
    entrypoint: >
      sh -c 'trap exit TERM; while :; do certbot renew --webroot -w /var/www/certbot; sleep 12h; done'

networks:
  dosedu_net:
    driver: bridge

volumes:
  postgres_data:
