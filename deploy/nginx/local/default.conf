# LOCAL TESTING ONLY — plain HTTP, no SSL. See deploy/LOCAL_TESTING.md.
# dosedu.local — public landing + lead form + login

upstream dosedu_api {
    server api:8080;
}

limit_req_zone $binary_remote_addr zone=leads_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name dosedu.local;

    root /usr/share/nginx/html/landing;
    index index.html;

    location /api/public/leads {
        limit_req zone=leads_zone burst=3 nodelay;
        proxy_pass http://dosedu_api/public/leads;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/public/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://dosedu_api/public/auth/login;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/public/telegram/webhook {
        proxy_pass http://dosedu_api/public/telegram/webhook;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/public/certificates/ {
        proxy_pass http://dosedu_api/public/certificates/;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/public/branches {
        proxy_pass http://dosedu_api/public/branches;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/public/placement-test/questions {
        proxy_pass http://dosedu_api/public/placement-test/questions;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/public/placement-test/submit {
        limit_req zone=leads_zone burst=3 nodelay;
        proxy_pass http://dosedu_api/public/placement-test/submit;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/family/ {
        rewrite ^/api/family/(.*)$ /family/$1 break;
        proxy_pass http://dosedu_api;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}

