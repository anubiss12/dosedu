# Shared config included by all subdomain server blocks.

upstream dosedu_api {
    server api:8080;
    keepalive 32;
}

# Rate limits: protects the public lead form and login endpoints from
# spam / brute-force, per spec's security-conscious design.
limit_req_zone $binary_remote_addr zone=leads_zone:10m rate=5r/m;
limit_req_zone $binary_remote_addr zone=login_zone:10m rate=10r/m;

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}
