# teacher.dosedu.kz — Teacher cabinet.
# client_max_body_size is bumped slightly above the app's 5MB upload
# limit so Nginx doesn't reject the request before the API can return
# its own friendly "file_too_large" JSON error.

server {
    listen 443 ssl http2;
    server_name teacher.dosedu.kz;

    ssl_certificate     /etc/letsencrypt/live/dosedu.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dosedu.kz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    client_max_body_size 8m;

    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://dosedu_api/public/auth/login;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /teacher/$1 break;
        proxy_pass http://dosedu_api;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        root /usr/share/nginx/html/teacher;
        try_files $uri $uri/ /index.html;
    }
}
