# s-admin.dosedu.kz — Super Admin panel.
# Per spec this is used "incognito" (out of sight of regular staff), so
# the config restricts access to an allowlist of admin IPs in addition
# to the app-level JWT + role check. Replace with real admin IPs before
# deploying, or remove the allow/deny block if IP allowlisting isn't
# desired.

server {
    listen 443 ssl http2;
    server_name s-admin.dosedu.kz;

    ssl_certificate     /etc/letsencrypt/live/dosedu.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dosedu.kz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    # --- optional network-level restriction ---
    # allow 203.0.113.10;   # replace with real admin IP(s)
    # deny all;

    location /api/public/auth/login {
        proxy_pass http://dosedu_api/public/auth/login;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /s-admin/$1 break;
        proxy_pass http://dosedu_api;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        root /usr/share/nginx/html/s-admin;
        try_files $uri $uri/ /index.html;
    }
}
