# app.dosedu.kz — Student & Parent portal (4-digit PIN login).
# Maps to the /family/* route group in the Go API.

server {
    listen 443 ssl http2;
    server_name app.dosedu.kz;

    ssl_certificate     /etc/letsencrypt/live/dosedu.kz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dosedu.kz/privkey.pem;
    include /etc/nginx/snippets/ssl-params.conf;

    location /api/auth/login {
        limit_req zone=login_zone burst=5 nodelay;
        proxy_pass http://dosedu_api/public/auth/login;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location /api/ {
        rewrite ^/api/(.*)$ /family/$1 break;
        proxy_pass http://dosedu_api;
        include /etc/nginx/snippets/proxy-params.conf;
    }

    location / {
        root /usr/share/nginx/html/app;
        try_files $uri $uri/ /index.html;
    }
}
