# Port 80 — serves the Let's Encrypt ACME HTTP-01 challenge for every
# dosedu.kz subdomain, and redirects everything else to HTTPS.

server {
    listen 80;
    server_name dosedu.kz www.dosedu.kz s-admin.dosedu.kz director.dosedu.kz teacher.dosedu.kz app.dosedu.kz;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}
